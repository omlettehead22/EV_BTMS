<text x="846.0" y="250.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">OCV, resistance, kinetics → heat q‴(t)</text>
<line x1="1000.0" y1="266.0" x2="1000.0" y2="282.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="830.0" y="284.0" width="340.0" height="58.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
<text x="846.0" y="308.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Module unit cell (B)</text>
<text x="846.0" y="328.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">inlet and outlet cell, coolant balance</text>
<line x1="1000.0" y1="344.0" x2="1000.0" y2="360.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="830.0" y="362.0" width="340.0" height="58.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
<text x="846.0" y="386.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Sweep the designs</text>
<text x="846.0" y="406.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">topology × flow × chiller × filler × gap</text>
<line x1="1000.0" y1="422.0" x2="1000.0" y2="438.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="830.0" y="440.0" width="340.0" height="76.0" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="846.0" y="464.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Trade-off and picks</text>
<text x="846.0" y="484.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">mass vs fan / pump / chiller energy,</text>
<text x="846.0" y="502.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">re-checked at worst-case resistance</text>
<text x="1170" y="584" font-size="11" fill="#8a8984" text-anchor="end">Schematic, not to scale. r<tspan baseline-shift='sub' font-size='8'>u</tspan>: radius of a circle with the same area as one cell's share.</text>
