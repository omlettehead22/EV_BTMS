<text x="846.0" y="152.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Duty cycle</text>
<text x="846.0" y="172.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">WLTC, motorway + rapid charge, constant C-rate</text>
<line x1="1000.0" y1="188.0" x2="1000.0" y2="204.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="830.0" y="206.0" width="340.0" height="58.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
