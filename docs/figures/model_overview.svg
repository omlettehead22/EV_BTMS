<text x="720.0" y="443.7" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">no heat crosses</text>
<text x="460.0" y="174.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Jelly roll: heat q‴(t) from the</text>
<text x="460.0" y="190.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">electro-thermal model; k, ρc<tspan baseline-shift='sub' font-size='9'>p</tspan></text>
<line x1="580.0" y1="194.348351646022" x2="580.0" y2="272.0" stroke="#8a8984" stroke-width="1"/>
<text x="670.0" y="138.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Filler: PCM melts and</text>
<text x="670.0" y="154.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">re-freezes (enthalpy form)</text>
<line x1="692.0" y1="158.348351646022" x2="692.0" y2="250.0" stroke="#8a8984" stroke-width="1"/>
<line x1="636.9" y1="361.4" x2="650.0" y2="399.7" stroke="#0f7a55" stroke-width="2.2" marker-end="url(#arrow-cool)"/>
<text x="450.0" y="481.7" font-size="12" fill="#0f7a55" font-weight="400" text-anchor="start">Cooling sink: a side ribbon takes heat at the can</text>
<text x="450.0" y="497.9" font-size="12" fill="#0f7a55" font-weight="400" text-anchor="start">into coolant at T<tspan baseline-shift='sub' font-size='9'>c</tspan>(t), set by the coolant's own heat</text>
<text x="450.0" y="514.1" font-size="12" fill="#0f7a55" font-weight="400" text-anchor="start">balance along the channel. A bottom plate takes</text>
<text x="450.0" y="530.3" font-size="12" fill="#0f7a55" font-weight="400" text-anchor="start">it from every node instead.</text>
<text x="830.0" y="104.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">C</text>
<text x="850.0" y="104.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Design loop</text>
