<text x="36.0" y="373.1" font-size="12" fill="#0f7a55" font-weight="600" text-anchor="start">coolant in</text>
<text x="387.0" y="373.1" font-size="12" fill="#0f7a55" font-weight="600" text-anchor="end">out</text>
<line x1="122.0" y1="369.1" x2="310.0" y2="369.1" stroke="#0f7a55" stroke-width="1.5" marker-end="url(#arrow-cool)"/>
<text x="36.0" y="397.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Coolant warms along the ribbon, so the outlet</text>
<text x="36.0" y="413.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">cell runs hottest. Every design is judged on it,</text>
<text x="36.0" y="429.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">and the inlet cell gives the cell-to-cell spread.</text>
<rect x="36.0" y="454.0807251039056" width="14" height="14" rx="3" fill="url(#roll)" stroke="#256abf"/>
<text x="58.0" y="465.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">cell (jelly roll)</text>
<rect x="36.0" y="476.0807251039056" width="14" height="14" rx="3" fill="#f6d79a" stroke="#c98a1b"/>
<text x="58.0" y="487.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">filler: PCM, PCM + graphite or air</text>
